kotlin.daemon.jvmargs=-Xmx4g

decompiler.version=1.9.3
decompiler.maxParallelThreads=2

starsector.gameDir=/mnt/store/Games/Starsector098-linux

# runGame 运行时约束：BoxUtil 等模组已为 Java 25 字节码，限定主版本避免误选 JBR 17。
# 默认走 JBR（~/.jdks/jbr-25.0.4.1）：识别为 JBR 后 SDG 自动附加 -XX:+AllowEnhancedClassRedefinition，
# 支持结构性热重定义，便于实机微调参数。改回游戏自带运行时：starsector.javaVendor=zulu；
# 或 starsector.javaExec 直指定可执行文件。
starsector.javaVersion=25
starsector.javaVendor=jetbrains
