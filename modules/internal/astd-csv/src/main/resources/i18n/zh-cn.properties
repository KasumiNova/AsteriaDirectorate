# descriptions.csv（text1 为设计案定稿原文逐字；text2~text5/notes 设计案未提供走 fallback）
desc.astd_piercing_lance.text1=星坠科研部为正面决胜打造的重型投射平台。两秒的充能过程将骇人的能量压缩进一枚高密度弹体，出膛后在毫秒之间贯穿战场——命中随后产生的冲击波能够吞没其中的一切。
# descriptions.csv RESOURCE（第五章“归档”：执行官核心双载体）
desc.astd_executor_core.text1=“执行官”核心——菀星设计总局特批签发的自动智能核心。它的签发依据只有一行：“依承包商履约记录，特批。”
desc.astd_executor_core.notes=一经签发，不予退换。
desc.astd_executor_core_combat.text1=“执行官”核心（战斗特化）。作为舰队军官上任指定指挥舰后，它将以近 Omega 档的作战参数执勤。
desc.astd_executor_core_combat.notes=签发即绑定，出售行为将被撤销。
desc.astd_executor_core_admin.text1=“执行官”核心（行政特化）。任命为殖民地管理官后，它将接管市场行政托管。
desc.astd_executor_core_admin.notes=签发即绑定，出售行为将被撤销。
# descriptions.csv RESOURCE（85 文档：G/B/A/O 量产核心，赏金舰队军官与打捞战利品）
desc.astd_ai_core_g.text1=一枚菀星设计总局制式 Gamma 级自动智能核心。出厂批次编目齐全，质检签章完好。
desc.astd_ai_core_g.notes=量产列装型。按总局资产台账管理，外流即视为账外物资。
desc.astd_ai_core_b.text1=一枚菀星设计总局制式 Beta 级自动智能核心。壳体铭牌：紫菀理事会监制，附出厂质检签章。
desc.astd_ai_core_b.notes=量产列装型。按总局资产台账管理，外流即视为账外物资。
desc.astd_ai_core_a.text1=一枚菀星设计总局制式 Alpha 级自动智能核心。壳体铭牌：紫菀理事会监制，附出厂质检签章。
desc.astd_ai_core_a.notes=可出任舰队军官或殖民地行政官。签发档案随核心一并流转。
desc.astd_ai_core_o.text1=一枚菀星设计总局制式 Omega 级自动智能核心。编目页缺失，实物存在性未经台账确认。
desc.astd_ai_core_o.notes=本条目依封存类目管理，不予公开。
# descriptions.csv CUSTOM（预留轨道设施描述）
desc.astd_reserved_station.text1=登记在册的预留轨道设施。结构完好，维生系统处于最低功率待机。一份两百年前的启用申请仍挂在第七分局的待办队列里，状态：受理中。
