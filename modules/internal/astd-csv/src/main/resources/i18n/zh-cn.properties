desc.astd_grav_rift_generator.text1=超载奇点核心，需锁定目标舰激活：在目标舰体表面撕开一道红色引力旋涡，旋涡在 1 秒延迟后向目标发射裂隙光束，光束命中处沿舰体周边展开时空引力裂隙。
desc.astd_grav_rift_generator.text2=进攻
desc.astd_grav_rift_generator.text3=超载奇点核心，需锁定目标舰激活：在目标舰体表面撕开一道红色引力旋涡，旋涡在 1 秒延迟后向目标发射裂隙光束，光束命中处沿舰体周边展开时空引力裂隙。
desc.astd_grav_rift_generator.text4=
desc.astd_grav_rift_generator.text5=光束持续命中期间每 0.1 秒布下一枚裂隙（最多 5 枚）。每枚裂隙对附近目标造成 600~1000（砺刃档 800~1400，随威胁等级最高 1200~2000）点能量坍缩伤害，伤害随裂隙序位递增。\n冷却时间 12 秒。
desc.astd_burst_flow_fighter.text1=叶随流水，花逐疾风。瞬时爆发时间流速与机动性，并为弹匣武器快速充能。
desc.astd_burst_flow_fighter.text2=机动
desc.astd_burst_flow_fighter.text3=叶随流水，花逐疾风。瞬时爆发时间流速与机动性，并为弹匣武器快速充能。
desc.astd_burst_flow_fighter.text4=
desc.astd_burst_flow_fighter.text5=1 秒内时间流速、加减速与弹匣充能速率大幅提升，并按当前向量附加冲刺动量；激活期间锁定舰船朝向。最多 2 次充能，每 10 秒恢复 1 次。
