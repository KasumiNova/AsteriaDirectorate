# descriptions.csv：顶部描述文本（舰船/武器/系统等）
# 注意：这些文本会进入 UI 的格式化流程；涉及百分号时使用全角 `％` 或 `%%`。
desc.astd_arc_flare.text1=“弧光耀斑”是遗构局弧光阵列的旗舰样机，舰体内置双重指挥协议，可在载人指挥与自律核心之间切换。
desc.astd_arc_flare.text2=宽阔舰艏容纳了多层弧光母线，能将持续火力推入极端密度。
desc.astd_arc_flare.notes=耀斑级的每次出航都像一次公开声明：遗构局仍在让旧宇宙的闪电服从新的纪律。
desc.astd_negentropy_edge.text1=“断熵弧刃”以高速突入与折跃回避为核心，舰体保留了显著的弧刃式轮廓。
desc.astd_negentropy_edge.text2=它适合在交战线外缘切入，借助机动窗口撕开目标防线。
desc.astd_negentropy_edge.notes=舰员常把它称作一把会自行选择鞘口的刀。
desc.astd_arc_jet.text1=“弧光喷流”把重型前向炮列锁入同一条火控母线。
desc.astd_arc_jet.text2=它缓慢压上战线，在长时间交火中维持舰队支点。
desc.astd_plasma_arch.text1=“等离子拱”把护盾生成器拆入装甲骨架，让整艘舰体承担冲击。
desc.astd_plasma_arch.text2=它停在火线上吸收压力，把反冲电弧释放给靠近的敌舰。
desc.astd_radiation_belt.text1=“辐射带”是轻型弧光驱逐舰，紧凑舰体搭配压限时流推进器。
desc.astd_radiation_belt.text2=它的任务是追赶、补刀，并在敌方护航圈中制造短促的高能峰值。
desc.astd_arc_flash.text1=“电弧闪”是弧光阵列的高速护卫舰，舰体轻薄，放电回路外露。
desc.astd_arc_flash.text2=它依靠静电释放创造近身窗口，然后迅速脱离火线。
desc.astd_gravitational_lens.text1=“引力透镜”是透镜矩阵的巡洋舰样机，以干扰蜂群与空间透镜阵列扰乱敌方射控。
desc.astd_gravitational_lens.text2=它在舰队中央制造错位的观测场，让敌舰把火力交给虚假的几何。
desc.astd_nebula_echo.text1=“星云回声”携带信标投放系统，能把战场标记为一片不断回响的目标网络。
desc.astd_nebula_echo.text2=它以速度与感知欺骗支撑友军突击。
desc.astd_magnetosphere_disturbance.text1=“磁层扰动”是量产化透镜主力舰，紧急召回系统让其能重整无人单元与战线位置。
desc.astd_magnetosphere_disturbance.text2=它的外层磁场会在交战中持续扰动传感回波。
desc.astd_dark_tide_nebula.text1=“暗潮星云”以电磁烟幕覆盖战场，舰体轮廓会在干扰雾中变得模糊。
desc.astd_dark_tide_nebula.text2=它负责遮蔽推进轴线，并为透镜舰队争取重构火线的时间。
desc.astd_diffraction.text1=“衍射”是透镜矩阵驱逐舰，搭载无人机激化系统与相位散射护层。
desc.astd_diffraction.text2=它擅长在多方向接触中制造假象与交叉火线。
desc.astd_flickering_phantom.text1=“闪烁虚影”是轻型透镜护卫舰，全息分身系统让它在敌方观测中留下多重残影。
desc.astd_flickering_phantom.text2=它承担侦察、牵制与近距诱导任务。
desc.astd_aurora_grid.text1=“极光栅格”是自律核心巡洋舰，舰体装甲下铺设了分布式防护栅格。
desc.astd_aurora_grid.text2=栅格硬化启动后，它会像一块发光的防线节点。
desc.astd_magnetic_storm_zigzag.text1=“磁暴折线”以急促机动与电磁爆发冲击敌方小型目标。
desc.astd_magnetic_storm_zigzag.text2=它在自律舰群中承担快速反应与边线清扫任务。
desc.astd_echo_shimmer.text1=“回声微光”是小型自律舰，信号过载系统会把自身存在感放大成刺眼噪声。
desc.astd_echo_shimmer.text2=它的价值在于扰乱敌方判断，并迫使对手浪费火力窗口。
desc.astd_apex_logic.text1=“顶点逻辑”是自律核心主力舰，逻辑崩塌协议会把战场变量压入可执行的毁伤序列。
desc.astd_apex_logic.text2=它像一座沉默的推理机，把前线问题转写成解。

desc.astd_echo_fixation_crewed.text1=透镜阵列把对手的弹道与航迹折叠进一段可回放的相位记录。
desc.astd_echo_fixation_crewed.text2=特殊
desc.astd_echo_fixation_crewed.text3=透镜阵列把对手的弹道与航迹折叠进一段可回放的相位记录。
desc.astd_echo_fixation_crewed.text4=
desc.astd_echo_fixation_crewed.text5=载人指挥态下，回声定影的相位采样并入情报中枢，为全队锚定误差解。
desc.astd_echo_fixation_automated.text1=透镜阵列把对手的弹道与航迹折叠进一段可回放的相位记录。
desc.astd_echo_fixation_automated.text2=特殊
desc.astd_echo_fixation_automated.text3=透镜阵列把对手的弹道与航迹折叠进一段可回放的相位记录。
desc.astd_echo_fixation_automated.text4=
desc.astd_echo_fixation_automated.text5=无人拓扑态下，回声定影的相位采样接入蜂群链路，覆盖更广的战场切面。
desc.astd_arc_flare_overdrive_crewed.text1=弧光耀斑将主回路锁入战斗模式，所有弧光导向算法切换为攻击倾向。
desc.astd_arc_flare_overdrive_crewed.text2=进攻
desc.astd_arc_flare_overdrive_crewed.text3=弧光耀斑将主回路锁入战斗模式，所有弧光导向算法切换为攻击倾向。
desc.astd_arc_flare_overdrive_crewed.text4=
desc.astd_arc_flare_overdrive_crewed.text5=舰桥接管火控权限，武器系统在超载协议下全速运转。\n载人指挥将这股力量导向持续压制，射速与弹匣回复同步提升。
desc.astd_arc_flare_overdrive.text1=弧光耀斑将主回路锁入战斗模式，所有弧光导向算法切换为攻击倾向。
desc.astd_arc_flare_overdrive.text2=进攻
desc.astd_arc_flare_overdrive.text3=弧光耀斑将主回路锁入战斗模式，所有弧光导向算法切换为攻击倾向。
desc.astd_arc_flare_overdrive.text4=
desc.astd_arc_flare_overdrive.text5=舰桥接管火控权限，武器系统在超载协议下全速运转。\n载人指挥将这股力量导向持续压制，射速与弹匣回复同步提升。
desc.astd_arc_flare_overdrive_automated.text1=弧光耀斑将主回路锁入战斗模式，自律核心把舰体推进与放电回路并入同一套突击序列。
desc.astd_arc_flare_overdrive_automated.text2=进攻
desc.astd_arc_flare_overdrive_automated.text3=弧光耀斑将主回路锁入战斗模式，自律核心把舰体推进与放电回路并入同一套突击序列。
desc.astd_arc_flare_overdrive_automated.text4=
desc.astd_arc_flare_overdrive_automated.text5=核心直连推进与火控，时间感知显著加速，装甲受损容限同步抬升。\n自律核心以突袭为优先，系统期间主动释放攻击电弧。
desc.astd_arc_shared_flux_network.text1=弧光共享辐能网络把旗舰电网转入开放式耗散状态。
desc.astd_arc_shared_flux_network.text2=支援
desc.astd_arc_shared_flux_network.text3=友舰获得更宽的射击窗口，过量辐能则沿链路回灌至弧光喷流。
desc.astd_arc_shared_flux_network.text4=舰体会牺牲自身火力与机动，换取整条战线的瞬时压制。
desc.astd_arc_shared_flux_network.text5=链路点亮，舰队开始共振。
desc.astd_plasma_armor_shield_boost.text1=舰船将大部分能量导向装甲护盾，显著增加护盾和装甲的承伤能力。
desc.astd_plasma_armor_shield_boost.text2=防御
