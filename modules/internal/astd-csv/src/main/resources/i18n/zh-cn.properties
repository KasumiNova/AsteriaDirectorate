desc.astd_gemini_bomber.text1=搭载“双子星”DEM 导弹的无人重型轰炸机，能够在友方战机的掩护下投射毁灭性的间接突破火力。但容易在密集火力面前避之不及。
desc.astd_surge_fighter.text1=透镜协议前线最常见的无人格斗单元，搭载电荷针刺。比起击毁目标，电涌级更擅长利用机动能力骚扰敌方，待到敌方炮组成片熄灭时，真正负责终结的火力已经在路上了。
desc.astd_gravwell_interceptor.text1=引力井级从不远离它所护卫的母舰。它像一颗贴身卫星般悬在舰侧，等不知好歹的战机群撞进坍缩炮的作用范围——然后那里就会多出一团短暂存在的、由残骸构成的星云。
