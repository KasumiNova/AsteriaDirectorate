desc.astd_lh_002_vision_shift.text1=舰船自身获得少量额外时间流速，并选择一艘敌对舰船，根据其舰船大小降低一定的时间流速，期间目标受到来自本舰的伤害提高，从其他单位受到的伤害大幅降低。效果受到难度系数影响。
desc.astd_lh_002_vision_shift.text2=特殊
desc.astd_lh_002_vision_shift.text3=舰船自身获得少量额外时间流速，并选择一艘敌对舰船，根据其舰船大小降低一定的时间流速，期间目标受到来自本舰的伤害提高，从其他单位受到的伤害大幅降低。效果受到难度系数影响。
desc.astd_lh_stardust_launcher_arc.text1=发射环绕本舰巡弋的自律光尘，主动撞击射程内的敌对目标。光尘优先拦截导弹与战机，撞击舰船时释放穿透性 EMP 电弧，目标硬辐能越高越容易被透盾。
desc.astd_lh_stardust_launcher_lens.text1=发射环绕本舰巡弋的自律光尘，主动撞击射程内的敌对目标。光尘优先拦截导弹与战机，撞击舰船时释放穿透性 EMP 电弧，目标硬辐能越高越容易被透盾。
