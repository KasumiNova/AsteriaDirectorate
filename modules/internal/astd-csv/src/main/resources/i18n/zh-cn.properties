desc.astd_xc_001_overdrive_crewed.text1=星坠将主回路锁入战斗模式，所有弧光导向算法切换为攻击倾向。
desc.astd_xc_001_overdrive_crewed.text2=进攻
desc.astd_xc_001_overdrive_crewed.text3=星坠将主回路锁入战斗模式，所有弧光导向算法切换为攻击倾向。
desc.astd_xc_001_overdrive_crewed.text4=
desc.astd_xc_001_overdrive_crewed.text5=舰桥接管火控权限，武器系统在超载协议下全速运转。\n载人指挥将这股力量导向持续压制，射速与弹匣回复同步提升。
desc.astd_xc_001_overdrive.text1=星坠将主回路锁入战斗模式，所有弧光导向算法切换为攻击倾向。
desc.astd_xc_001_overdrive.text2=进攻
desc.astd_xc_001_overdrive.text3=星坠将主回路锁入战斗模式，所有弧光导向算法切换为攻击倾向。
desc.astd_xc_001_overdrive.text4=
desc.astd_xc_001_overdrive.text5=舰桥接管火控权限，武器系统在超载协议下全速运转。\n载人指挥将这股力量导向持续压制，射速与弹匣回复同步提升。
desc.astd_xc_001_overdrive_automated.text1=星坠将主回路锁入战斗模式，自律核心把舰体推进与放电回路并入同一套突击序列。
desc.astd_xc_001_overdrive_automated.text2=进攻
desc.astd_xc_001_overdrive_automated.text3=星坠将主回路锁入战斗模式，自律核心把舰体推进与放电回路并入同一套突击序列。
desc.astd_xc_001_overdrive_automated.text4=
desc.astd_xc_001_overdrive_automated.text5=核心直连推进与火控，时间感知显著加速，装甲受损容限同步抬升。\n自律核心以突袭为优先，系统期间主动释放攻击电弧。
desc.astd_arc_shared_flux_network.text1=弧光共享辐能网络把旗舰电网转入开放式耗散状态。
desc.astd_arc_shared_flux_network.text2=支援
desc.astd_arc_shared_flux_network.text3=友舰获得更宽的射击窗口，过量辐能则沿链路回灌至烽燧。
desc.astd_arc_shared_flux_network.text4=舰体会牺牲自身火力与机动，换取整条战线的瞬时压制。
desc.astd_arc_shared_flux_network.text5=链路点亮，舰队开始共振。
desc.astd_plasma_armor_shield_boost.text1=舰船将大部分能量导向装甲护盾，显著增加护盾和装甲的承伤能力。
desc.astd_plasma_armor_shield_boost.text2=防御
desc.astd_plasma_armor_shield_boost.text3=舰船将大部分能量导向装甲护盾，显著增加护盾和装甲的承伤能力。
desc.astd_plasma_armor_shield_boost.text4=
desc.astd_plasma_armor_shield_boost.text5=护盾减少 {{50％}}} 受到的伤害，装甲减少 {{25％}}} 受到的伤害。\n并禁用非导弹（不包括点防御）武器。\n激活期间护盾受到的单次伤害大于舰船最大辐能的 {{5％}}} 时，超出的伤害部分降低 {{50％}}}。\n等离子装甲护盾的装甲计算值翻倍。\n并使离子化反冲蓄能器效果翻倍。
desc.astd_limit_temporal_thruster.text1=压限时流推进器把舰体周围的局部时间压缩成短促推进窗口。
desc.astd_limit_temporal_thruster.text2=机动
desc.astd_limit_temporal_thruster.text3=列星会在瞬间获得更快节奏与侧向机动，用于追击、规避或抢占角度。
desc.astd_limit_temporal_thruster.text4=推进窗口不会强化武器，只把船体送到更危险的位置。
desc.astd_limit_temporal_thruster.text5=时流收紧，舰影先一步越过火线。
desc.astd_gcp12.text1=一种使用紫菀科研部引力科技的光束炮。与常规直射光束武器不同，引力坍缩炮通过发射引力空间束，在目标地点产生空间震荡，并严重扭曲该位置的空间连续性。对装甲和船体这类实体材料效果极佳，但无法对护盾造成显著压力。
desc.astd_gcp12.notes=
desc.astd_gcp8.text1=一种使用紫菀科研部引力科技的光束炮。与常规直射光束武器不同，引力坍缩炮通过发射引力空间束，在目标地点产生空间震荡，并严重扭曲该位置的空间连续性。对装甲和船体这类实体材料效果极佳，但无法对护盾造成显著压力。
desc.astd_gcp4.text1=一种使用紫菀科研部引力科技的光束炮。与常规直射光束武器不同，引力坍缩炮通过发射引力空间束，在目标地点产生空间震荡，并严重扭曲该位置的空间连续性。对装甲和船体这类实体材料效果极佳，但无法对护盾造成显著压力。
desc.astd_gcp2.text1=一种使用紫菀科研部引力科技的光束炮。与常规直射光束武器不同，引力坍缩炮通过发射引力空间束，在目标地点产生空间震荡，并严重扭曲该位置的空间连续性。对装甲和船体这类实体材料效果极佳，但无法对护盾造成显著压力。这个版本的引力坍缩炮调整了爆发周期，使其更适合对抗密集的战机型目标。
