# 奇点投射器（新星/事件视界）：机制说明（weapon_data.csv tooltip）
# descriptions.csv：顶部描述文本（舰船/武器/系统等）
# 注意：这些文本会进入 UI 的格式化流程；涉及百分号时使用全角 `％` 或 `%%`。
desc.astd_xc_001.text1=星坠-级主力舰是星坠理事会的旗舰样机，依靠双重指挥协议在载人指挥与自律核心之间切换，能够在正面战场维持极端密度的持续火力。\n\n在理事会尚存的年代，星坠-级出现在战线哪一段，哪一段的交火就会迅速失去悬念：宽阔舰首容纳的多层弧光母线为一门内置主炮与两翼炮列供能，整套火控只为"让星星坠落"这一件事服务。现存的作战记录里，它极少需要第二次齐射窗口。\n\n大崩塌之后，星坠-级的蓝图与船坞档案一并消失，如今偶尔被目击的个体都被认为是崩塌前下水的同型舰。它们听命于谁、由谁驾驶，没有一份档案能够回答。\n\n实验代号 [XC-001]。理事会以自局名称呼自己的旗舰，就足以显现该舰的地位了。
desc.astd_xc_002.text1=淬刃-级驱逐舰是星坠理事会的实验性猎杀平台，围绕一门内置的[断熵]同步偏射炮建造，并依靠坍缩折跃在战场上穿行，执行高风险的精确突袭。\n\n档案中该级只有一艘的下水记录，没有量产计划，也没有后续编号。大崩塌后它数度易主，每一位新主人都宣称摸清了它的折跃节律，每一份作战报告都在同一个窗口期里中断。\n\n实验代号 [XC-002]。命名取自淬池——熔炉旁淬火的水池；刃成之后，不再回炉。
desc.astd_xc_101.text1=星坠理事会量产的战线中坚：熔壁-级巡洋舰。能够以单舰之躯承载主力舰级的火力，其形象也与低端科技的一艘热门巡洋舰型颇为相似。\n\n熔壁-级在档案中出现的频率可谓是相当之高，是组织里最常见的装甲舰。当然，让熔壁级真正出名的是它独特的分布式等离子装甲护盾，这种高度集成于整艘舰船的设计让熔壁-级的护盾具有极高的抗动能打击能力，并通过反冲蓄能器再将打击产生的冲击能量回敬给周围的对方。也因如此，即便是处于武器下线状态的熔壁-级也颇具威胁。熔壁-级也因为其出色的生存能力在各位宇宙民之间颇受好评，无疑是星坠理事会里最成功的量产型巡洋舰。\n\n代号 [XC-101]。熔铸的墙壁。
desc.astd_xc_102.text1=星坠理事会的主要舰队支点：烽燧-级堡垒主力舰，无论是单独作战还是集群作战都是一个不容小觑的威胁，其形象似乎与速子科技旗下的一项秘密 AI 计划中所设计的舰船颇为相似。\n\n烽燧-级的武装和形象可谓是极为暴力：大量的广阔前向火炮槽位，夸张的堡垒式长翼造型，以及遍布舰船全身的辐能网络，每一项设计都能完美诠释星坠理事会的舰船设计风格。\n\n烽燧-级还能够承担火控中心的作用，其内置的共享战术网络能够与周围的所有舰船建立共享链接，并提升友舰的射程。当战术系统激活的时候，还能额外建立辐能链接，为周围的舰船缓解辐能压力。\n\n代号 [XC-102]。边塞燃火为号、列台传讯。
desc.astd_xc_103.text1=由星坠理事会设计的列星-级驱逐舰，可以看作是淬刃-级的量产化版本。通常会与同级和逐电-级成群结队在战场中以追猎者的形式出现。\n\n根据目前的档案中得知，我们目前见到的这类舰船已经是经过了多轮现代化改造的版本。列星-级依靠充沛的武装配置和极具进攻性的战术系统，能够在短时间的爆发窗口中快速对同级目标造成毁灭性的打击，如果在这一轮攻势下敌舰还残存一息，那么它很快就会被下一艘列星-级或逐电-级所终结。\n\n成群结队的列星-级威胁极大，它们能够在各自舰船间建立追猎网络，反复调谐舰船的各类系统，并相互掩护，如果进攻方没有专门用于对抗狼群作战体系的配装，那么整个战场将会变成列星-级的无伤狩猎场。正因如此，列星-级也深受狼群作战体系的舰长们所青睐。\n\n代号 [XC-103]。诸星成列。
desc.astd_xc_104.text1=“逐电”是星坠理事会的高速护卫舰，舰体轻薄，放电回路外露。
desc.astd_xc_104.text2=它依靠静电释放创造近身窗口，然后迅速脱离火线。
desc.astd_zw_001.text1=决明-级巡洋舰是紫菀理事会的实验性舰船设计，以远超于同规格巡洋航母的规格在战场上创造绝对的统治力。\n\n据目前能够得知的档案里，决明-级的首次出现是在一处边缘星垣的星系中，紫菀理事会几乎将所有最前沿的引力技术都投入在了这艘舰船。而成果显然非常令人满意：在首轮同规模的集群作战测试中就以压倒性的优势取得了胜利。这些无疑是归功于能够直接改变战场环境的引力投射器，又或是能够极大幅度提升战机作战效率的视界甲板。并且因为决明-级出色的生存能力，一度让常驻于旗舰地位的飞蓬-级受到严重的威胁。\n\n然而，决明最后并没能走出实验阶段，大崩塌发生后，大量的实验性引力科技器材断供导致第七分局无法再造出这样惊人的舰船了。如今我们能够见到的这艘决明-级很可能就是档案中所描述的，从边缘星垣造出的第一艘实验性引力科技舰船，也是最后一艘。也许未来的某个时刻英仙座可以重新创造出它的仿舰，但那很可能是非常久之后的事了。\n\n实验代号 [ZW-001]。紫菀的造物以明目本草为名——[决明] 即明目之药，古别名还瞳子。
desc.astd_zw_002.text1=“密蒙”以电磁烟幕覆盖战场，舰体轮廓会在干扰雾中变得模糊。
desc.astd_zw_002.text2=它负责遮蔽推进轴线，并为透镜舰队争取重构火线的时间。
desc.astd_zw_101.text1=“舜华”携带信标投放系统，能把战场标记为一片不断回响的目标网络。
desc.astd_zw_101.text2=它以速度与感知欺骗支撑友军突击。
desc.astd_zw_102.text1=“飞蓬”是量产化透镜主力舰，紧急召回系统让其能重整无人单元与战线位置。
desc.astd_zw_102.text2=它的外层磁场会在交战中持续扰动传感回波。
desc.astd_zw_103.text1=茑萝-级最初的定位是用于护航高价值单位的战斗航母，能够在主力舰提供火力掩护的前提下，对近距离的同级目标造成毁灭性的打击。
desc.astd_zw_103.text2=茑萝-级在近距离的格斗能力相当出色，且最出名的大概就是它的能源核心所搭载的裂隙发生器了 —— 茑萝-级能够短暂超载自身的能源核心，在较短距离的目标展开一道引力裂隙，随后释放一束裂隙喷流，对目标位置产生多段引力坍缩，造成严重的坍缩伤害。\n茑萝-级的引力相位甲板搭载了独特的相位无人战机，能够与母舰形成引力联结，当它们同时对单个目标发起进攻时，其威胁等级毫不弱于坠星科研部的列星-级，甚至可以说更强。
desc.astd_zl_001.text1=“统律”是自律核心主力舰，逻辑崩塌协议会把战场变量压入可执行的毁伤序列。
desc.astd_zl_001.text2=它像一座沉默的推理机，把前线问题转写成解。
desc.astd_zl_101.text1=“列栅”是自律核心巡洋舰，舰体装甲下铺设了分布式防护栅格。
desc.astd_zl_101.text2=栅格硬化启动后，它会像一块发光的防线节点。
desc.astd_zl_102.text1=“游徼”以急促机动与电磁爆发冲击敌方小型目标。
desc.astd_zl_102.text2=它在自律舰群中承担快速反应与边线清扫任务。
desc.astd_zl_103.text1=“值星”是小型自律舰，信号过载系统会把自身存在感放大成刺眼噪声。
desc.astd_zl_103.text2=它的价值在于扰乱敌方判断，并迫使对手浪费火力窗口。
desc.astd_lh_001.text1=飞星-级先进炮艇是星坠与紫菀两局罕见的联合设计品，以护卫舰的体量装载了为单舰对决校准的整套火控。\n\n作为仅次于决明-级的技术复杂度，在护卫舰级的体量中几乎塞入了菀星设计总局所有已知的前沿技术，其目的只有一个：以超规格的武装和最先进的辐能网络来以小博大，并从中取胜。很显然，飞星-级目前能够展示在我们眼前，就说明它已经做到了。\n\n尽管档案中经常记录该舰级夸张的舰船维护开销，和极高的飞船驾驶员技能需求，但这些都无法掩盖飞星-级出色的战斗能力。作为两局联制品，该舰级的产量记录在大崩塌中佚失，现存个体的署名栏里同时留着两个局的印记——星坠出锻，紫菀出萼。\n\n代号 [LH-001]。萼是护花的甲；它的造价栏比某些巡洋舰还长。
desc.astd_lh_002.text1=飞星-级先进炮艇是星坠与紫菀两局罕见的联合设计品，以护卫舰的体量装载了为单舰对决校准的整套火控。\n\n作为仅次于决明-级的技术复杂度，在护卫舰级的体量中几乎塞入了菀星设计总局所有已知的前沿技术，其目的只有一个：以超规格的武装和最先进的辐能网络来以小博大，并从中取胜。很显然，飞星-级目前能够展示在我们眼前，就说明它已经做到了。\n\n尽管档案中经常记录该舰级夸张的舰船维护开销，和极高的飞船驾驶员技能需求，但这些都无法掩盖飞星-级出色的战斗能力。作为两局联制品，该舰级的产量记录在大崩塌中佚失，现存个体的署名栏里同时留着两个局的印记——星坠出锻，紫菀出萼。\n\n代号 [LH-002]。萼是护花的甲；它的造价栏比某些巡洋舰还长。
desc.astd_lh_001_burst_flow.text1=激活时，舰船根据当前航向附加爆发冲刺动量（150％/200％/300％ 最大航速，随难度系数），期间无法转向，并获得爆发性时间流速、加减速、辐能耗散速率与巨额非导弹武器备弹恢复加成。效果受到难度系数影响。
desc.astd_lh_001_burst_flow.text2=机动
desc.astd_lh_001_burst_flow.text3=激活时，舰船根据当前航向附加爆发冲刺动量（150％/200％/300％ 最大航速，随难度系数），期间无法转向，并获得爆发性时间流速、加减速、辐能耗散速率与巨额非导弹武器备弹恢复加成。效果受到难度系数影响。
