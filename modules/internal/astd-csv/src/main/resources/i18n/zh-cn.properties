weapon.astd_seven_stars.tooltip.customPrimary=发射时立即折跃射弹至目标位置，短暂延迟后产生一次裂隙爆炸，造成等额面板伤害。随后射弹会以短暂间隔持续折跃至下一个可打击目标，并再次引发裂隙爆炸。\n\n折跃后的射弹如果无法找到点防御目标，或者折跃次数已达 {%s} 次，则选择最近的舰船单位引发一次裂隙爆炸。效果受到{%s}影响。
