desc.astd_plasma_armor_shield_boost.text4=
desc.astd_plasma_armor_shield_boost.text5=护盾减少 {{50％}}} 受到的伤害，装甲减少 {{25％}}} 受到的伤害。\n并禁用非导弹（不包括点防御）武器。\n激活期间护盾受到的单次伤害大于舰船最大辐能的 {{5％}}} 时，超出的伤害部分降低 {{50％}}}。\n等离子装甲护盾的装甲计算值翻倍。\n并使离子化反冲蓄能器效果翻倍。
desc.astd_limit_temporal_thruster.text1=压限时流推进器把舰体周围的局部时间压缩成短促推进窗口。
desc.astd_limit_temporal_thruster.text2=机动
desc.astd_limit_temporal_thruster.text3=辐射带会在瞬间获得更快节奏与侧向机动，用于追击、规避或抢占角度。
desc.astd_limit_temporal_thruster.text4=推进窗口不会强化武器，只把船体送到更危险的位置。
desc.astd_limit_temporal_thruster.text5=时流收紧，舰影先一步越过火线。

desc.astd_gcp12.text1=GCP-12 以宽幅引力坍缩束撕扯命中区域，在重型目标周围制造雪崩式结构失效。
desc.astd_gcp12.notes=坍缩束会把稳定性转化为负债。每一次脉冲都在要求目标偿还结构上的旧账。
desc.astd_gcp8.text1=GCP-8 保留了完整的坍缩脉冲机制，体量更适合巡洋舰与机动作战平台。
desc.astd_gcp4.text1=GCP-4 是中型坍缩炮，适合用持续束流压迫装甲破口。
desc.astd_gcp2.text1=GCP-2 将坍缩技术压缩为点防束，用微型空间碎裂清理近距威胁。
desc.astd_psi_omega.text1=PSI-Ω 以灵能裂解束锁定目标，把维持舰体秩序的统御意志从系统中抽离。
desc.astd_psi_omega.notes=它留下的创口常常很小，舰桥里的沉默却会持续很久。


