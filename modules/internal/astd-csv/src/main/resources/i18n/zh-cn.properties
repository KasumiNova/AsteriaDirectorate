desc.astd_cuifeng_torpedo.text1=坠星科研部研发的一种重型反舰鱼雷。使用极为激进的大当量反物质装药和实验性推进器设计，能够快速对重型单位造成严重打击。种种特性使得摧锋在同档位反舰武器下表现出空前绝后的水平，但最终仍因为制造成本过高并没有走向量产化。
