desc.astd_fighter_grav_link.text1=引力联结协议将机群的时间轴与母舰锚定，令战机以数倍流速倾泻火力，并在协议结束时将全机群折叠回机库。
desc.astd_fighter_grav_link.text2=支援
desc.astd_fighter_grav_link.text3=引力联结协议将机群的时间轴与母舰锚定，令战机以数倍流速倾泻火力，并在协议结束时将全机群折叠回机库。
desc.astd_fighter_grav_link.text4=
desc.astd_fighter_grav_link.text5=激活后至多 15 秒内（再次按键可提前关闭），本舰战机时间流速提升 100％~200％（砺刃档 +150％），受到的所有伤害降低 25％~75％（砺刃档 50％）。\n持续期间每秒产出舰船基础最大辐能 7％ 的软辐能；系统结束时召回全部部署在外的战机并快速重新出击，未耗散的全部软辐能等量转化为硬辐能。\n冷却时间 25 秒。
desc.astd_echo_fixation_automated.text1=透镜阵列把对手的弹道与航迹折叠进一段可回放的相位记录。
desc.astd_echo_fixation_automated.text2=特殊
desc.astd_echo_fixation_automated.text3=透镜阵列把对手的弹道与航迹折叠进一段可回放的相位记录。
