dynamic.systems=astd_arc_shared_flux_network,astd_suppression_mode,astd_gression_charge,astd_fighter_grav_link,astd_grav_rift_generator,astd_grav_storm,astd_grav_timeflow_interference,astd_grav_replicator

desc.astd_arc_shared_flux_network.text1=以自身武器射速和舰船机动性为代价，提升辐能耗散能力，并链接舰船周围的所有友舰，将友舰的辐能传输到自身，传输速率会随着距离本舰的距离而受到影响。
desc.astd_arc_shared_flux_network.text2=支援
desc.astd_arc_shared_flux_network.text3=以自身武器射速和舰船机动性为代价，提升辐能耗散能力，并链接舰船周围的所有友舰，将友舰的辐能传输到自身，传输速率会随着距离本舰的距离而受到影响。
desc.astd_arc_shared_flux_network.text4=
desc.astd_arc_shared_flux_network.text5=降低自身的 {{50%%}} 舰船武器射速与机动性，提升自身 {{%dissipationBonus%}} 的辐能耗散速率和 {{%hardDissipationPoints%}} 硬辐能耗散速率。\n每秒以自身 {{%transferRate%}} 的辐能耗散速率将友舰的辐能等比传输到自身，而硬辐能则以该速率的 {{%hardTransferRate%}} 效率传输；总传输速率不超过自身辐能耗散的 {{200%%}}，超额时优先传输辐能水平最高的友舰。\n链接范围为 {{%range%}}，在链接范围超过 {{%minEfficiencyRange%}} 时达到最低传输效率 25%%，链接范围小于 {{%fullEfficiencyRange%}} 时达到最大传输效率 {{100%%}}。\n{{难度系数}} 系统: 可在模组 {{菀星设计总局}} 的 Lunalib 设置中调整相关机制数值。
tooltip.system.astd_arc_shared_flux_network.default.dissipationBonus=40%
tooltip.system.astd_arc_shared_flux_network.default.hardDissipationPoints=20%
tooltip.system.astd_arc_shared_flux_network.default.transferRate=50%
tooltip.system.astd_arc_shared_flux_network.default.hardTransferRate=25%
tooltip.system.astd_arc_shared_flux_network.default.range=1200su
tooltip.system.astd_arc_shared_flux_network.default.minEfficiencyRange=900su
tooltip.system.astd_arc_shared_flux_network.default.fullEfficiencyRange=300su

desc.astd_suppression_mode.text1=压制模式将列星锚定为固定火力平台：牺牲机动换取射程、射速与护盾承伤的全面强化。
desc.astd_suppression_mode.text2=攻击
desc.astd_suppression_mode.text3=压制模式将列星锚定为固定火力平台：牺牲机动换取射程、射速与护盾承伤的全面强化。
desc.astd_suppression_mode.text4=
desc.astd_suppression_mode.text5=最大航速与机动性降低 {{%speedPenalty%}}，武器产生的辐能降低 {{%weaponFluxReduction%}}，护盾受到的伤害降低 {{%shieldReduction%}}，武器射程提升 {{%rangeBonus%}}，武器射速提升 {{30%%}}。\n开启期间每秒产出舰船基础最大辐能 {{2%%}} 的硬辐能，随激活时间推移提升，第 4 秒达到最高 {{6%%}}。\n激活 1 秒后达到最高加成，持续 8 秒，随后在 1 秒内结束，冷却 10 秒。\n{{难度系数}} 系统: 可在模组 {{菀星设计总局}} 的 Lunalib 设置中调整相关机制数值。
tooltip.system.astd_suppression_mode.default.speedPenalty=50%
tooltip.system.astd_suppression_mode.default.weaponFluxReduction=50%
tooltip.system.astd_suppression_mode.default.shieldReduction=30%
tooltip.system.astd_suppression_mode.default.rangeBonus=30%

desc.astd_gression_charge.text1=短暂蓄能后令舰船引擎进入极限超载，驱使舰船沿朝向发起不可阻挡的破阵冲锋，大幅提升舰船质量并偏转来袭火力。
desc.astd_gression_charge.text2=机动
desc.astd_gression_charge.text3=短暂蓄能后令舰船引擎进入极限超载，驱使舰船沿朝向发起不可阻挡的破阵冲锋，大幅提升舰船质量并偏转来袭火力。
desc.astd_gression_charge.text4=
desc.astd_gression_charge.text5=激活后短暂充能 {{0.5}} 秒，随后将航速锁定到最大，获得 {{%speedBonus%}} 的最大航速与加速度加成，并降低 {{80%%}} 的转向速率。\n冲刺期间舰船受到的全类型伤害降低 {{%damageReduction%}}}，舰船质量提升 {{%massMult%}}}。\n冲刺期间如果遭遇剧烈撞击，或战术系统结束时，会对舰首前方扇形区 ({{%coneArc%°}}/{{%coneRange%}}) 释放一次锥状冲击，造成 {{%coneDamage%}} 点能量伤害，并向前方产生冲击推力推动所有目标，随后结束系统。\n{{难度系数}} 系统: 可在模组 {{菀星设计总局}} 的 Lunalib 设置中调整相关机制数值。
tooltip.system.astd_gression_charge.default.speedBonus=200%
tooltip.system.astd_gression_charge.default.damageReduction=50%
tooltip.system.astd_gression_charge.default.massMult=200%
tooltip.system.astd_gression_charge.default.coneArc=60
tooltip.system.astd_gression_charge.default.coneRange=450su
tooltip.system.astd_gression_charge.default.coneDamage=1000

desc.astd_fighter_grav_link.text1=超载奇点核心，将机群的时间轴与母舰锚定，令战机以数倍流速倾泻火力，系统结束时将全部战机召回机库。
desc.astd_fighter_grav_link.text2=支援
desc.astd_fighter_grav_link.text3=超载奇点核心，将机群的时间轴与母舰锚定，令战机以数倍流速倾泻火力，系统结束时将全部战机召回机库。
desc.astd_fighter_grav_link.text4=
desc.astd_fighter_grav_link.text5=激活时本舰战机时间流速提升 {{%timeMult%}}，受到的伤害降低 {{%damageReduction%}}。\n系统结束时召回全部部署在外的战机并立即重新出击，且未耗散的全部软辐能将会等量转化为硬辐能。\n{{难度系数}} 系统: 可在模组 {{菀星设计总局}} 的 Lunalib 设置中调整相关机制数值。
tooltip.system.astd_fighter_grav_link.default.timeMult=150%
tooltip.system.astd_fighter_grav_link.default.damageReduction=50%

desc.astd_grav_rift_generator.text1=超载奇点核心，需锁定目标舰激活：在目标舰船护盾覆盖的位置展开一道红色引力旋涡，旋涡展开后不再跟随目标移动，并在 1 秒延迟后发射裂隙光束，光束命中处沿舰体周边展开时空引力裂隙。
desc.astd_grav_rift_generator.text2=进攻
desc.astd_grav_rift_generator.text3=超载奇点核心，需锁定目标舰激活：在目标舰船护盾覆盖的位置展开一道红色引力旋涡，旋涡展开后不再跟随目标移动，并在 1 秒延迟后发射裂隙光束，光束命中处沿舰体周边展开时空引力裂隙。
desc.astd_grav_rift_generator.text4=
desc.astd_grav_rift_generator.text5=系统持续期间，舰船获得 {{%damageReduction%}} 全类型固定减伤、并锁定相位系统。\n光束命中时产生数个引力裂隙，每个裂隙对附近目标造成 {{%riftDamageMin%~%riftDamageMax%}} 点能量伤害，伤害随裂隙序位递增。\n{{难度系数}} 系统: 可在模组 {{菀星设计总局}} 的 Lunalib 设置中调整相关机制数值。
tooltip.system.astd_grav_rift_generator.default.damageReduction=20%
tooltip.system.astd_grav_rift_generator.default.riftDamageMin=1000
tooltip.system.astd_grav_rift_generator.default.riftDamageMax=1500

desc.astd_grav_storm.text1=超载奇点核心，密蒙-级开始短暂充能，完毕后对舰船前方锥状范围内的所有目标 (包括相位单位与战机)释放大量电弧打击，造成短暂的强制过载效果。
desc.astd_grav_storm.text2=进攻
desc.astd_grav_storm.text3=超载奇点核心，密蒙-级开始短暂充能，完毕后对舰船前方锥状范围内的所有目标 (包括相位单位与战机)释放大量电弧打击，造成短暂的强制过载效果。
desc.astd_grav_storm.text4=
desc.astd_grav_storm.text5=根据充能时间造成 {{1}}~{{2}} 秒的强制过载；每个被过载的目标会将舰船自身当前硬辐能的一定比例转化为等额软辐能。\n充能时获得 {{%damageReduction%}} 的固定伤害减免。\n{{难度系数}} 系统: 可在模组 {{菀星设计总局}} 的 Lunalib 设置中调整相关机制数值。
tooltip.system.astd_grav_storm.default.damageReduction=50%

desc.astd_grav_timeflow_interference.text1=超载奇点核心，需锁定友军舰船激活：在自身与目标之间建立引力时流干涉链接，令目标与其所属舰载机的时间流速短时间内大幅提升，并在激活瞬间立即缩减目标舰船系统的剩余冷却时间。
desc.astd_grav_timeflow_interference.text2=支援
desc.astd_grav_timeflow_interference.text3=超载奇点核心，需锁定友军舰船激活：在自身与目标之间建立引力时流干涉链接，令目标与其所属舰载机的时间流速短时间内大幅提升，并在激活瞬间立即缩减目标舰船系统的剩余冷却时间。
desc.astd_grav_timeflow_interference.text4=
desc.astd_grav_timeflow_interference.text5=目标时间流速提升至 {{%timeMult%}}，所属舰载机同步获得时流增幅；激活瞬间立即缩减目标舰船系统 {{%cooldownReduction%}} 的剩余冷却时间。\n{{难度系数}} 系统: 可在模组 {{菀星设计总局}} 的 Lunalib 设置中调整相关机制数值。
tooltip.system.astd_grav_timeflow_interference.default.timeMult=200%
tooltip.system.astd_grav_timeflow_interference.default.cooldownReduction=60%

desc.astd_grav_replicator.text1=超载奇点核心，激活期间发射的所有能量武器射弹 (不包括实弹武器)会在发射的 0.5 秒后，在发射点位置再次发射两次同类弹体，造成原弹体 %damageRatio% 的伤害，且只产生 %fluxRatio% 的辐能。
desc.astd_grav_replicator.text2=进攻
desc.astd_grav_replicator.text3=超载奇点核心，激活期间发射的所有能量武器射弹 (不包括实弹武器)会在发射的 0.5 秒后，在发射点位置再次发射两次同类弹体，造成原弹体 %damageRatio% 的伤害，且只产生 %fluxRatio% 的辐能。
desc.astd_grav_replicator.text4=
desc.astd_grav_replicator.text5=激活期间发射的所有能量武器射弹 (不包括实弹武器)会在发射的 {{0.5}} 秒后，在发射点位置再次发射两次同类弹体，造成原弹体 {{%damageRatio%}} 的伤害，且只产生 {{%fluxRatio%}} 的辐能。\n{{难度系数}} 系统: 可在模组 {{菀星设计总局}} 的 Lunalib 设置中调整相关机制数值。
tooltip.system.astd_grav_replicator.default.damageRatio=50%
tooltip.system.astd_grav_replicator.default.fluxRatio=50%
