# 奇点投射器（新星/事件视界）：机制说明（weapon_data.csv tooltip）
weapon.astd_sgl8.tooltip.customPrimary=因果律修正：每 {%s} 执行一次轨迹重算；重定向期间其存在概率收敛（速度 ×{%s}，持续 {%s}）。\n\n事件穿透：当目标防御网络（幅能）≥ {%s} 时，弹体将绕过三维实存的护盾阻隔，直接对船体执行逻辑覆盖。\n\n结构剥离：命中后在 {%s} 内持续造成总计 {%s} 的能量振荡损伤，旨在从分子级瓦解结构稳定性。\n\n质量解构：按目标质量与当前完整性追加 ≤{%s} 的额外能量代价；造成损伤的 {%s} 将转化为本场战斗中不可修复的永久性质量缺失。\n\n可规避：弹体存在不稳定性，可被点防击落；失效或被拦截将引发区域性的自爆（不伤及友方单位）。\n\n坍缩域：自爆半径 {%s}，核心伤害强度为基准值的 {%s}（随视界范围衰减）。
weapon.astd_sgl8.tooltip.customPrimaryHL=2s | 50％ | 0.45s | 85％ | 1s | 800％ | 100％ | 1％ | 180 | 60％

