# Weapon tooltip 自定义字段
# 说明:
# - 多行 Tip 的写法是“CSV 单元格内真实换行”, 而不是字面量 `\n`。
#   Java properties 会把 `\n` 解析为换行字符；ss-csv 在生成 CSV 时会自动给含换行的字段加引号, 从而保留多行文本。
# - `{%s}` 是游戏侧用于高亮替换的占位符；其替换内容来自 `customPrimaryHL`, 并按 `|` 分隔依次填入。

# 时空坍缩炮 (隐藏喷口)的“引力撕裂”说明

# GCP: 可装配坍缩炮的机制说明
weapon.astd_gcp12.tooltip.customPrimary=空间剪切：发射相干引力子束，在命中点诱发周期性的拓扑剥离。坍缩过程会强制重写局部时空连续性。\n\n拓扑失效：每 {%s} 引发一次范围性的空间碎裂，对区域内所有单位造成额外能量损伤（由中心 {%s} 向边缘 {%s} 线性衰减）。\n\n逻辑剥离：命中船体后判定装甲完整性。若剩余装甲百分比低于 {%s}，将穿透防御格栅造成物理覆盖——伤害取本次坍缩伤害的 {%s}，绕过装甲减伤结算。
weapon.astd_gcp12.tooltip.customPrimaryHL=0.5s | 100% | 50% | 50% | 100%

