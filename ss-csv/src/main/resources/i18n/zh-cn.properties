# DRV-Ω：相对论驱动炮（Omega）机制说明
weapon.astd_drv_omega.customPrimary=装填纪律：仅在弹匣打空后开始装填，每 {%s} 一次性恢复 {%s} 发。\n\n目标门限：若射界内无有效敌方目标，无法开火（抑制空放与无效充能）。\n\n红移重击：弹匣最后一发充能时间变为 {%s}，并造成 {%s} 伤害；命中时额外爆发 {%s} 道红色 EMP 电弧（单道伤害等同于面板），击中护盾时电弧有概率穿透护盾。
weapon.astd_drv_omega.customPrimaryHL=5s | 3 | 1.5s | 300% | 3~5
