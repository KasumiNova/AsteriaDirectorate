hullmod.astd_arc_advanced_fire_control.desc=先进火控回路接入舰体主反应堆，允许弧光喷流在高压交火中维持更锋利的射击节律。
hullmod.astd_arc_advanced_fire_control.short=主炮火控与射击节律强化
hullmod.astd_arc_shared_tactical_network.desc=战术网络把友舰遥测压入同一条弧光链路，让旗舰的辐能窗口在舰队中回响。
hullmod.astd_arc_shared_tactical_network.short=共享链路与辐能窗口协同
hullmod.astd_plasma_armor_shield.desc=阿斯忒里亚遗构局 独特的舰船结构设计。该舰的护盾生成器被拆散为多个微型护盾单元，分布在全舰装甲并完美集成。护盾本身会表现出类似装甲的承压特征。
hullmod.astd_plasma_armor_shield.short=装甲-护盾承压耦合
hullmod.astd_ionized_recoil_accumulator.desc=等离子装甲护盾的附属产物。虽然使用了离子蓄能器的等离子护盾的防御效率不如星域中常规的护盾生成器，但这种独特的电容对外界压力更加敏感，使其能够在通过护盾受击时出现的能量压力，迅速释放并转化为定向能打击目标。
hullmod.astd_ionized_recoil_accumulator.short=受击回收与反冲电弧
hullmod.astd_arc_advanced_targeting_system.desc=弧光先进目标定位系统持续修正高速目标轨迹，让辐射带在追击窗口中先一步点燃射线。
hullmod.astd_arc_advanced_targeting_system.short=高速目标解算与追击锁定
hullmod.astd_distributed_pursuit_network.desc=分布式追猎节点把引擎与火控同步到同一拍点，迫使猎物不断暴露转向余量。
hullmod.astd_distributed_pursuit_network.short=机动追击与火控链路协同
weapon.astd_tsm_omega.primaryRoleStr=终结打击

weapon.astd_arc13.customPrimary=连射三发弧光，每发造成不同类型伤害：动能、高爆、破片（破片伤害为面板的 {%s}）。
weapon.astd_arc13.customPrimaryHL=300%
weapon.astd_arc13.customAncillary=不受到光束武器的伤害加成。

# PSI-Ω：灵能裂解束（weapon_data.csv tooltip）
weapon.astd_psi_omega.tooltip.customPrimary=灵魂虹吸：持续照射同一目标 {%s} 后达到峰值。有人舰每秒抽离当前 CR 的 {%s}；无人/自动化单位每秒抽离最大 PPT 的 {%s}。\n\n护盾削弱：护盾命中后，抽离效率 ×{%s}。\n\n生命回馈：抽离量的 {%s} 回馈为自身 CR，并按目标舰体等级折损（护卫→主力：{%s}）。\n\n“它灼穿装甲表象，抽离维持战舰运作的统御意志。”
