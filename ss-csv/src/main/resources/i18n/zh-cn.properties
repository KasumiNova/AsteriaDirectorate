# descriptions.csv：顶部描述文本（武器/系统等）
# 注意：这些文本很可能也会进入 UI 的格式化流程；为稳妥起见，建议使用全角百分号 `％`，或使用 `%%`。
desc.astd_stellar_jet.text1=恒星喷射。将反应堆输出直接导向矢量喷流阵列。在此状态下，护盾将强制转化为 [旁路整形] 模式。
desc.astd_stellar_jet.text2=牺牲全向防御以换取指向性的结构强化，通过过载的流量来实现亚光速层级的战术位移。
desc.astd_stellar_jet.text3=同时激活喷射口武器：光束 DPS 动态 = 最大辐能容量 × 15％。
desc.astd_stellar_jet.text4=耗辐能：最大辐能 × 20％/秒；单次激活预算 × 150％（耗尽强制关闭）。系统开启期间将发射高频能量弹幕以覆盖近程空域。

desc.astd_stellar_jet_emitter.text1=系统联动喷射口武器：仅在『恒星喷射』系统启用时激活。
desc.astd_stellar_jet_emitter.text2=光束 DPS 动态 = 最大辐能容量 × 15％。
desc.astd_stellar_jet_emitter.text3=持续耗辐能作为燃料：最大辐能 × 20％/秒；单次激活预算 × 150％，耗尽则系统强制关闭。
desc.astd_stellar_jet_emitter.text4=系统开启期间额外发射能量弹：20 发/秒，单发伤害 = 光束 DPS × 10％~20％，射程与光束一致。

desc.astd_gcp12.text1=引力剪切波通过发射相干的引力子束，在目标坐标点诱发周期性的拓扑剥离。这种“坍缩”并非单纯的能量释放，而是对局部时空连续性的强制重写。
desc.astd_gcp12.notes=这种剪切效应会将物质结构的稳定性转化为热力学意义上的负资产。真正致命的并非初次的冲击，而是随后发生的雪崩式结构失效，将目标的防御逻辑推向不可挽回的临界点。

